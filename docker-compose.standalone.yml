# Standalone deployment — no .env file, no repository checkout needed.
# Copy this single file to your server, edit the values marked "CHANGE",
# then run:
#
#   docker compose -f docker-compose.standalone.yml up -d
#
# Or rename to docker-compose.yml on the server and just run:
#
#   docker compose up -d

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword          # CHANGE
      MYSQL_DATABASE: Quan_Ly_Quan_Cafe
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3306:3306"

  immudb:
    image: codenotary/immudb:latest
    restart: unless-stopped
    # IMPORTANT: Use named volumes — do NOT use bind mounts.
    # immudb runs as UID 3322. Bind mounts cause:
    #   "permission denied: open /var/lib/immudb/immudb.identifier"
    # If you must use bind mounts, run: sudo chown -R 3322:3322 /your/path
    volumes:
      - immudb_data:/var/lib/immudb
    environment:
      IMMUDB_ADMIN_PASSWORD: immudb              # CHANGE for production
    healthcheck:
      test: ["CMD", "immuadmin", "audit", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "3322:3322"                              # gRPC — app connects here
      - "9497:9497"                              # Web console
      - "8080:8080"                              # REST API

  app:
    image: ghcr.io/dng-nguyn/wnc-2026-n01.lt2:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      immudb:
        condition: service_healthy
    environment:
      DB_HOST: db                                # Docker service name — do not change
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_PASSWORD: rootpassword                  # MUST match MYSQL_ROOT_PASSWORD
      DB_DATABASE: Quan_Ly_Quan_Cafe
      JWT_SECRET: change-me-in-production        # CHANGE
      SESSION_SECRET: change-me-in-production     # CHANGE
      NODE_ENV: development                      # Use "production" once DB schema is stable
      PORT: "3000"
      FRONTEND_URL: http://localhost              # CHANGE to your domain for CORS
      SEPAY_API_KEY: your_sepay_api_key           # CHANGE
      SEPAY_ACCOUNT_NUMBER: "0000000000"          # CHANGE
      SEPAY_BANK_NAME: MBBank
      INIT_DB_SEED: "true"                        # Set to "false" after first run
      DB_SYNC: "true"                             # Set to "false" once schema is stable
      # Immudb — accessible via Docker service DNS
      IMMUDB_HOST: immudb                        # Docker service name — do not change
      IMMUDB_PORT: "3322"
      IMMUDB_USER: immudb
      IMMUDB_PASSWORD: immudb                    # MUST match IMMUDB_ADMIN_PASSWORD
      IMMUDB_DATABASE: defaultdb
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "80:3000"

volumes:
  mysql_data:
  immudb_data:

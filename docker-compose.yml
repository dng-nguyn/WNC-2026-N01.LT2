services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-Quan_Ly_Quan_Cafe}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Uncomment to expose MySQL to the host (development only)
    # ports:
    #   - "3306:3306"

  immudb:
    image: codenotary/immudb:latest
    restart: unless-stopped
    # Use named volumes to avoid UID 3322 permission issues with bind mounts.
    # Do NOT use bind mounts (e.g. /opt/immudb/data:/var/lib/immudb) — the
    # immudb container runs as UID 3322 and the host directory ownership
    # will cause "permission denied" on immudb.identifier.
    volumes:
      - immudb_data:/var/lib/immudb
    environment:
      IMMUDB_ADMIN_PASSWORD: ${IMMUDB_ADMIN_PASSWORD:-immudb}
    healthcheck:
      test: ["CMD", "immuadmin", "audit", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Ports exposed for local development / direct access
    ports:
      - "${IMMUDB_GRPC_PORT:-3322}:3322"
      - "${IMMUDB_WEB_PORT:-9497}:9497"
      - "${IMMUDB_REST_PORT:-8080}:8080"

  app:
    image: ghcr.io/dng-nguyn/wnc-2026-n01.lt2:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      immudb:
        condition: service_healthy
    environment:
      # DB_HOST is the Docker service DNS name — must stay "db"
      DB_HOST: db
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      DB_DATABASE: ${DB_DATABASE:-Quan_Ly_Quan_Cafe}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SEPAY_API_KEY: ${SEPAY_API_KEY:-your_sepay_api_key}
      SEPAY_ACCOUNT_NUMBER: ${SEPAY_ACCOUNT_NUMBER:-0000000000}
      SEPAY_BANK_NAME: ${SEPAY_BANK_NAME:-MBBank}
      INIT_DB_SEED: ${INIT_DB_SEED:-false}
      DB_SYNC: ${DB_SYNC:-true}
      # immudb — accessible via Docker service DNS
      IMMUDB_HOST: immudb
      IMMUDB_PORT: ${IMMUDB_PORT:-3322}
      IMMUDB_USER: ${IMMUDB_USER:-immudb}
      IMMUDB_PASSWORD: ${IMMUDB_ADMIN_PASSWORD:-immudb}
      IMMUDB_DATABASE: ${IMMUDB_DATABASE:-defaultdb}
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "${APP_PORT:-80}:${PORT:-3000}"


volumes:
  mysql_data:
  immudb_data:

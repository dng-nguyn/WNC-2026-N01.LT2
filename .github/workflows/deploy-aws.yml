name: Deploy to AWS ECS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.aws/**'
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_TASK_DEFINITION: .aws/task-definition.json
  CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx create --use
          docker buildx build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Provision missing secrets in Secrets Manager
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          SECRET_ARN_PREFIX="arn:aws:secretsmanager:${{ env.AWS_REGION }}:${AWS_ACCOUNT_ID}:secret:coffee-shop-pos"

          # Create JWT_SECRET if missing
          if ! aws secretsmanager describe-secret --secret-id coffee-shop-pos/jwt-secret --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "Creating JWT_SECRET..."
            aws secretsmanager create-secret \
              --name coffee-shop-pos/jwt-secret \
              --secret-string "$(openssl rand -base64 48)" \
              --region ${{ env.AWS_REGION }}
          else
            echo "JWT_SECRET already exists."
          fi

          # Create SESSION_SECRET if missing
          if ! aws secretsmanager describe-secret --secret-id coffee-shop-pos/session-secret --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "Creating SESSION_SECRET..."
            aws secretsmanager create-secret \
              --name coffee-shop-pos/session-secret \
              --secret-string "$(openssl rand -base64 48)" \
              --region ${{ env.AWS_REGION }}
          else
            echo "SESSION_SECRET already exists."
          fi

      - name: Replace task definition placeholders
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          sed -i "s|<AWS_ACCOUNT_ID>|$AWS_ACCOUNT_ID|g" $ECS_TASK_DEFINITION
          sed -i "s|<AWS_REGION>|$AWS_REGION|g" $ECS_TASK_DEFINITION
          sed -i "s|<YOUR_DOMAIN>|$FRONTEND_URL|g" $ECS_TASK_DEFINITION

      - name: Fill in image ID in ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

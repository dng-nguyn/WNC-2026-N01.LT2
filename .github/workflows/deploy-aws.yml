name: Deploy to AWS ECS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - '.aws/**'
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_TASK_DEFINITION: .aws/task-definition.json
  CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx create --use
          docker buildx build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT


      - name: Replace task definition placeholders
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SEPAY_API_KEY: ${{ secrets.SEPAY_API_KEY }}
          SEPAY_ACCOUNT_NUMBER: ${{ secrets.SEPAY_ACCOUNT_NUMBER }}
          SEPAY_BANK_NAME: ${{ secrets.SEPAY_BANK_NAME }}
        run: |
          sed -i "s|<AWS_ACCOUNT_ID>|$AWS_ACCOUNT_ID|g" $ECS_TASK_DEFINITION
          sed -i "s|<AWS_REGION>|$AWS_REGION|g" $ECS_TASK_DEFINITION
          sed -i "s|<YOUR_DOMAIN>|$FRONTEND_URL|g" $ECS_TASK_DEFINITION
          sed -i "s|<JWT_SECRET>|$JWT_SECRET|g" $ECS_TASK_DEFINITION
          sed -i "s|<SESSION_SECRET>|$SESSION_SECRET|g" $ECS_TASK_DEFINITION
          sed -i "s|<SEPAY_API_KEY>|$SEPAY_API_KEY|g" $ECS_TASK_DEFINITION
          sed -i "s|<SEPAY_ACCOUNT_NUMBER>|$SEPAY_ACCOUNT_NUMBER|g" $ECS_TASK_DEFINITION
          sed -i "s|<SEPAY_BANK_NAME>|$SEPAY_BANK_NAME|g" $ECS_TASK_DEFINITION

      - name: Fill in image ID in ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
